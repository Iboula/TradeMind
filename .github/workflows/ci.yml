name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore TradeMind.sln --verbosity quiet
      - name: Build
        run: dotnet build TradeMind.sln --configuration Release --no-restore --verbosity quiet
      - name: Test
        run: dotnet test TradeMind.sln --configuration Release --no-build --verbosity quiet
