name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main, "feature/**"]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip

jobs:
  quality:
    name: Restore, build, test and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore solution
        run: dotnet restore TradeMind.sln --verbosity minimal

      - name: Restore repository tools
        run: dotnet tool restore

      - name: Validate dependency rules
        shell: pwsh
        run: ./scripts/validate-dependencies.ps1

      - name: Validate observability assets
        shell: pwsh
        run: |
          $dashboard = Get-Content observability/grafana/dashboards/trademind-overview.json -Raw | ConvertFrom-Json
          if ($dashboard.title -ne 'TradeMind Overview') {
            throw 'The TradeMind Grafana dashboard has an unexpected title.'
          }
          $compose = Get-Content docker-compose.observability.yml -Raw
          if ($compose -match '(?i)(password|secret|token|api[_-]?key|connectionstring)') {
            throw 'Observability compose configuration must not contain credentials or secrets.'
          }
          $collector = Get-Content observability/otel-collector-config.yml -Raw
          if ($collector -notmatch '(?m)^\s*otlp:\s*$' -or $collector -notmatch '(?m)^\s*debug:\s*$') {
            throw 'The OTLP collector configuration is incomplete.'
          }
          docker compose -f docker-compose.observability.yml config --quiet

      - name: Build Release
        run: dotnet build TradeMind.sln --configuration Release --no-restore --verbosity minimal

      - name: Test with coverage
        shell: pwsh
        run: ./scripts/test-with-coverage.ps1 -Configuration Release -ResultsDirectory TestResults

      - name: Verify coverage inputs
        shell: pwsh
        run: |
          $coverageFiles = Get-ChildItem TestResults -Recurse -Filter coverage.cobertura.xml -File
          if ($coverageFiles.Count -eq 0) {
            throw "No Coverlet Cobertura files were produced."
          }
          "Coverlet produced $($coverageFiles.Count) Cobertura files."

      - name: Generate Cobertura report
        if: always()
        run: >-
          dotnet tool run reportgenerator
          -reports:"TestResults/**/coverage.cobertura.xml"
          -targetdir:"coverage"
          -reporttypes:"Cobertura;HtmlInline_AzurePipelines;MarkdownSummaryGithub"
          -filefilters:"-*RegexGenerator.g.cs"

      - name: Publish coverage summary
        if: always()
        shell: bash
        run: |
          if [ -f coverage/SummaryGithub.md ]; then
            cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage
          path: |
            TestResults
            coverage
          if-no-files-found: warn
