name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore TradeMind.sln --verbosity minimal
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          dotnet build TradeMind.sln --configuration Release --no-restore --verbosity minimal 2>&1 | tee build.log
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          dotnet test TradeMind.sln --configuration Release --no-build --verbosity minimal 2>&1 | tee test.log
