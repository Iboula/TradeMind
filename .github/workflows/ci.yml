name: CI

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore TradeMind.slnx

      - name: Build
        run: dotnet build TradeMind.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test TradeMind.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
