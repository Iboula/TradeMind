name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore TradeMind.sln --verbosity quiet
      - name: Build
        id: build
        shell: bash
        continue-on-error: true
        run: dotnet build TradeMind.sln --configuration Release --no-restore --verbosity diagnostic > build.log 2>&1
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build.log
      - name: Fail when build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
      - name: Test
        id: test
        shell: bash
        continue-on-error: true
        run: dotnet test TradeMind.sln --configuration Release --no-build --verbosity minimal > test.log 2>&1
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: test.log
          if-no-files-found: ignore
      - name: Fail when tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1
