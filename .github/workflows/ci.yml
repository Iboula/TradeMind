name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore TradeMind.sln --verbosity quiet
      - name: Build
        shell: bash
        run: |
          if ! dotnet build TradeMind.sln --configuration Release --no-restore --verbosity minimal > build.log 2>&1; then
            grep -Ei "error|failed" build.log || true
            tail -n 80 build.log
            exit 1
          fi
          tail -n 20 build.log
      - name: Test
        shell: bash
        run: |
          if ! dotnet test TradeMind.sln --configuration Release --no-build --verbosity minimal > test.log 2>&1; then
            grep -Ei "error|failed|failure" test.log || true
            tail -n 80 test.log
            exit 1
          fi
          tail -n 30 test.log
