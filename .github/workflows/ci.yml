name: CI

on:
  push:
    branches: [ main, agent/** ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore TradeMind.slnx --verbosity quiet
      - name: Build
        shell: bash
        run: |
          if ! dotnet build TradeMind.slnx --configuration Release --no-restore --verbosity quiet > build.log 2>&1; then
            grep -E "error (CS|NU|MSB)|Build FAILED" build.log || cat build.log
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: trademind
          POSTGRES_USER: trademind
          POSTGRES_PASSWORD: trademind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trademind -d trademind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__KnowledgeHub: Host=localhost;Port=5432;Database=trademind;Username=trademind;Password=trademind
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore TradeMind.slnx --verbosity quiet
      - name: Test
        run: dotnet test TradeMind.slnx --configuration Release --logger "trx;LogFileName=test-results.trx" --verbosity normal
